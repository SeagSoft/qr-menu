spring:
  application:
    name: qr-menu-platform

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Dev profile (H2)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:qrmenu;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: dev-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm-replace-in-prod
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  base-url: http://localhost:3000

---
# Production profile (PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:qrmenu}
    username: ${DB_USER:qrmenu}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  base-url: ${APP_BASE_URL:http://localhost:3000}
